name: Prepare model release
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Model package version without v'
        required: true
        default: '0.7.0'
      source_ref:
        description: 'Model packaging source commit'
        required: true
        default: main
      library_version:
        description: 'Published time-whisper tag used for qualification'
        required: true
        default: '0.7.0'
      all_sha256:
        description: 'SHA256 of model-all-VERSION.zip; omit when not releasing All'
        required: false
      en_sha256:
        description: 'SHA256 of model-en-VERSION.zip; omit when not releasing English'
        required: false
permissions:
  contents: write
concurrency:
  group: model-release-${{ inputs.version }}
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: macos-15
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ inputs.version }}
      LIBRARY_VERSION: ${{ inputs.library_version }}
      ALL_SHA256: ${{ inputs.all_sha256 }}
      EN_SHA256: ${{ inputs.en_sha256 }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: dayedge/time-whisper
          ref: ${{ inputs.library_version }}
          path: build/library
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify inputs from the draft release
        run: |
          python3 -c 'import os,sys; sys.path.insert(0,"scripts"); from model import version; version(os.environ["VERSION"]); version(os.environ["LIBRARY_VERSION"])'
          test "$(gh release view "$VERSION" --json isDraft --jq .isDraft)" = true
          git ls-remote --tags origin "refs/tags/$VERSION" > build/release-tag.txt
          test ! -s build/release-tag.txt
          mkdir -p build/downloads build/verified
          python3 - <<'PYCODE'
          import os, re, subprocess
          from pathlib import Path
          from scripts.model import unpack
          selected = []
          for variant, key in [('all', 'ALL_SHA256'), ('en', 'EN_SHA256')]:
              digest = os.environ.get(key, '')
              if not digest:
                  continue
              if not re.fullmatch('[0-9a-f]{64}', digest):
                  raise SystemExit('Invalid input checksum')
              selected.append((variant, digest))
          if not selected:
              raise SystemExit('Supply at least one variant checksum')
          for variant, digest in selected:
              filename = f'model-{variant}-{os.environ["VERSION"]}.zip'
              subprocess.run(['gh', 'release', 'download', os.environ['VERSION'], '--pattern', filename, '--dir', 'build/downloads'], check=True)
              extracted = unpack(Path('build/downloads') / filename, digest, Path(f'build/unpack-{variant}'))
              (extracted / variant).rename(Path('build/verified') / variant)
          PYCODE
          python3 - <<'PYCODE'
          import json
          from pathlib import Path
          from scripts.model import present_variants, source_state
          state = source_state(Path('build/library'))
          for variant in present_variants(Path('build/verified')):
              metadata = json.loads(Path(f'build/verified/{variant}/metadata.json').read_text())
              if (metadata['library_source_commit'] != state['commit']
                      or metadata.get('library_source_sha256') != state['sha256']
                      or metadata.get('release_ready') is not True):
                  raise SystemExit('Requalify against the exact clean published library tag')
          PYCODE
      - name: Qualify selected variants against the published library
        run: |
          python3 scripts/test_model.py
          python3 scripts/test_release.py
          python3 - <<'PYCODE'
          import os, subprocess
          from pathlib import Path
          from scripts.model import present_variants, VARIANTS
          for variant in present_variants(Path('build/verified')):
              folder = (Path('build/verified') / variant / 'export').resolve()
              languages = VARIANTS[variant][1]
              subprocess.run(['make', '-C', 'build/library', 'check', f'MODEL={folder}',
                              'CORPORA=' + ' '.join(languages), 'SPELLING=1'],
                             env={**os.environ, 'TIME_WHISPER_TAGGER': str(folder)}, check=True)
          PYCODE
          python3 scripts/model.py build --version "$VERSION" --library-version "$LIBRARY_VERSION"
          python3 scripts/smoke.py --library build/library
          swift package --package-path build/package dump-package > /dev/null
      - name: Prepare release tag and draft assets
        run: |
          test "$(gh release view "$VERSION" --json isDraft --jq .isDraft)" = true
          gh release upload "$VERSION" build/distributions/*.zip build/distributions/*.sha256 build/distributions/*-metadata.json --clobber
          cp build/distributions/Package.swift Package.swift
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Package.swift
          git commit -m "Release TimeWhisper models $VERSION"
          git tag "$VERSION"
          git push origin "refs/tags/$VERSION"
          gh release edit "$VERSION" --target "$(git rev-parse HEAD)"
          echo 'Draft prepared. Review it, then publish explicitly with gh release edit --draft=false.'
